shim-version: v0.3.18@sha256:7d9f98be78c91ede89f43c948a12d084fae34312effe9395ca7ed572991cb561
cvm-version: 0.7.5
cpus: 2
memory: 8192

containers:
  - name: "api-server"
    image: "ghcr.io/tinfoilsh/code-execution-environment/api-server@sha256:4bf18b9a178c87e0342945755d515d29ade352cb2ebb3f29d54b40f0dd1f96a0" # v0.0.14
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    memory: "1g"
    cpus: 0.5
    volumes:
      - "execsock:/run/execsock"

  - name: "executor"
    image: "ghcr.io/tinfoilsh/code-execution-environment/executor@sha256:7b2fee807c6ad950cdc3689dcf76ca0986ef929e35026bb3527f1edea7cbe61b" # v0.0.14
    user: "1000:1000"
    read_only: true
    tmpfs:
      /workspace: "size=512m,mode=1777"
      /tmp: "size=3g,mode=1777"
      # /user-uploads is owned by uid 1000 (the executor)
      /user-uploads: "size=256m,mode=755,uid=1000,gid=1000"
    cap_drop: ["ALL"]
    # SETUID/SETGID let the executor spawn bash as uid 1001 to enforce ro /user-uploads
    cap_add: ["SETUID", "SETGID"]
    security_opt:
      - "no-new-privileges:true"
    memory: "6g" # Could be smaller but no need
    cpus: 1.5
    network_mode: "none"
    volumes:
      - "execsock:/run/execsock"

shim:
  upstream-port: 8000
  paths:
    - /exec
    - /read
    - /write
    - /snapshot
    - /restore
    - /sync-uploads/manifest
    - /sync-uploads/blobs
    - /health

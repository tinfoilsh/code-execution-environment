cvm-version: 0.10.0
cpus: 2
memory: 8192

networks:
  web:
    egress: open

containers:
  - name: "api-server"
    image: "ghcr.io/tinfoilsh/code-execution-environment/api-server@sha256:e1cb4f491e9a4849af892e8cdf6c857a00de78a92fcd86e4a0d836f25c06a7f4" # v0.0.17
    user: "1000:1000"
    memory: "1g"
    cpus: 0.5
    volumes:
      - "execsock:/run/execsock"

  - name: "executor"
    image: "ghcr.io/tinfoilsh/code-execution-environment/executor@sha256:d47e359082bedb8d8950da2b988caf2689a833fbe64190b77742bc95ccbc76e0" # v0.0.17
    networks: [web]
    user: "1000:1000"
    tmpfs:
      /workspace: "size=512m,mode=1777"
      /tmp: "size=3g,mode=1777"
      # /user-uploads is owned by uid 1000 (the executor)
      /user-uploads: "size=256m,mode=755,uid=1000,gid=1000"
    # SETUID/SETGID let the executor spawn bash as uid 1001 to enforce ro /user-uploads
    cap_add: ["SETUID", "SETGID"]
    memory: "6g"
    cpus: 1.5
    volumes:
      - "execsock:/run/execsock"

shim:
  upstream-port: 8000
  upstream-container: api-server
  paths:
    - /exec
    - /read
    - /write
    - /snapshot
    - /restore
    - /sync-uploads/manifest
    - /sync-uploads/blobs
    - /health

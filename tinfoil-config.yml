shim-version: v0.3.18@sha256:7d9f98be78c91ede89f43c948a12d084fae34312effe9395ca7ed572991cb561
cvm-version: 0.7.5
cpus: 2
memory: 8192

containers:
  - name: "api-server"
    image: "ghcr.io/tinfoilsh/code-execution-environment/api-server@sha256:9a8171cb264007d87883f075b1e0816f9e0a5d7a522e6e2ddfff7fff5cf5c9fe" # v0.0.9
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    memory: "1g"
    cpus: 0.5
    volumes:
      - "execsock:/run/execsock"

  - name: "executor"
    image: "ghcr.io/tinfoilsh/code-execution-environment/executor@sha256:c428fc1b81a1d5746999c2e9c1fcbe69ce007f7b04ccf5d26f855a8dcb434e3a" # v0.0.9
    user: "1000:1000"
    read_only: true
    tmpfs:
      /workspace: "size=512m,mode=1777"
      /tmp: "size=64m,mode=1777"
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    memory: "6g" # Could be smaller but no need
    cpus: 1.5
    network_mode: "none"
    volumes:
      - "execsock:/run/execsock"

shim:
  upstream-port: 8000
  paths:
    - /exec
    - /read
    - /write
    - /snapshot
    - /restore
    - /health

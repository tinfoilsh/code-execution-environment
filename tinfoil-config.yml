shim-version: v0.3.18@sha256:7d9f98be78c91ede89f43c948a12d084fae34312effe9395ca7ed572991cb561
cvm-version: 0.7.5
cpus: 2
memory: 8192

containers:
  - name: "api-server"
    image: "ghcr.io/tinfoilsh/code-execution-environment/api-server@sha256:f227ae74dfc90ede4441707f92f5c561f77ba4a49897ba2bc348f0afd6c93576" # v0.0.12
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    memory: "1g"
    cpus: 0.5
    volumes:
      - "execsock:/run/execsock"

  - name: "executor"
    image: "ghcr.io/tinfoilsh/code-execution-environment/executor@sha256:0c40296d6d1ed92bfc8a0fc19994cde0d7ea73777efb65938a4c3b910e428215" # v0.0.12
    user: "1000:1000"
    read_only: true
    tmpfs:
      /workspace: "size=512m,mode=1777"
      /tmp: "size=64m,mode=1777"
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    memory: "6g" # Could be smaller but no need
    cpus: 1.5
    network_mode: "none"
    volumes:
      - "execsock:/run/execsock"

shim:
  upstream-port: 8000
  paths:
    - /exec
    - /read
    - /write
    - /snapshot
    - /restore
    - /health
